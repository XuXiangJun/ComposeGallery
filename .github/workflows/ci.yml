name: CI

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试覆盖解码 / 缩放 / 并行扫描 / GIF / 持久化，无头即可跑，不需要显示器。
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # 与 build.gradle.kts 的 jvmToolchain(21) 一致

      - uses: gradle/actions/setup-gradle@v4

      # 用 bash：Windows runner 默认 shell 是 pwsh，那边要写 gradlew.bat。
      - name: Test
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test/
          if-no-files-found: ignore

  # 打包是跨平台声明最容易被悄悄破坏的地方（jpackage / jlink / 图标 / targetFormats），
  # 所以单独跑一遍免安装 zip：只用 JDK 自带的 jpackage，不需要联网下载 WiX。
  package:
    name: packageZip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # macOS 暂不纳入：README 已注明 .app 内含符号链接、macOS 打包路径尚未验证过。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        shell: bash
        run: ./gradlew packageZip --stacktrace

      # 打包成功 ≠ 程序能跑：jpackage 只检查 --input 里有没有 jar，skiko 原生库缺失、
      # 同基名 jar 互相覆盖这类问题它一律放过。verifyPackageZip 把这些查一遍。
      - name: Verify package
        shell: bash
        run: ./gradlew verifyPackageZip --stacktrace

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: composegallery-zip-${{ matrix.os }}
          path: build/compose/binaries/main/app/*.zip
          if-no-files-found: error

  # 推 v* tag 时把各平台的免安装 zip 挂到 GitHub Release 上。
  release:
    name: release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: composegallery-zip-*
          path: dist

      # 两个平台的 zip 同名（ComposeGallery-<版本>.zip），按平台改名避免互相覆盖。
      - name: Rename per platform
        shell: bash
        run: |
          for d in dist/composegallery-zip-*; do
            os="${d##*composegallery-zip-}"
            for f in "$d"/*.zip; do mv "$f" "dist/$(basename "${f%.zip}")-${os%-latest}.zip"; done
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
